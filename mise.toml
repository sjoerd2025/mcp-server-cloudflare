# mise.toml - lightweight task wrapper around the repository's existing pnpm scripts
# https://mise.jdx.dev/

[tools]
node = "20.18.0"
pnpm = "10.8.0"
turbo = "2.10.7"

[env]
PNPM_HOME = "{{ env.HOME }}/.pnpm"
NODE_ENV = "development"
FORCE_COLOR = "1"

[tasks.setup]
description = "Install dependencies and scaffold the local environment"
run = """
pnpm install
pnpm run dev:setup
pnpm run check:deps
"""
depends = ["validate:tools"]

[tasks."validate:tools"]
description = "Validate essential tools are available"
run = """
echo "Checking node version..."
node --version
echo "Checking pnpm version..."
pnpm --version
echo "Checking turbo version..."
turbo --version || echo "⚠️  Turbo will be installed with pnpm install"
"""

[tasks."validate:format"]
description = "Check formatting"
run = "pnpm run check:format"

[tasks."validate:lint"]
description = "Run linting"
run = "pnpm run lint"

[tasks."validate:types"]
description = "Run TypeScript type checking"
run = "pnpm run typecheck"

[tasks."validate:deps"]
description = "Validate dependency consistency"
run = "pnpm run check:deps"

[tasks."validate:all"]
description = "Run the full validation suite"
run = "pnpm run check"

[tasks.build]
description = "Build all apps and packages"
run = "pnpm run build"

[tasks.dev]
description = "Start the local development stack"
run = "pnpm run dev"
depends = ["validate:tools"]

[tasks."dev:setup"]
description = "Create the local development environment file from the template"
run = "pnpm run dev:setup"

[tasks."dev:app"]
description = "Start a specific app via the root dev manager"
run = "pnpm run dev:app -- ${1:-}"

[tasks.test]
description = "Run the test suite"
run = "pnpm run test"

[tasks."test:watch"]
description = "Run Vitest in watch mode"
run = "pnpm run test:watch"

[tasks."test:ci"]
description = "Run CI-style tests"
run = "pnpm run test:ci"

[tasks.format]
description = "Format source files"
run = "pnpm run fix:format"

[tasks."format:check"]
description = "Check formatting without modifying files"
run = "pnpm run check:format"

[tasks."lint:fix"]
description = "Apply lint fixes"
run = "pnpm run lint -- --fix"

[tasks."deps:check"]
description = "Validate dependency consistency"
run = "pnpm run check:deps"

[tasks."deps:update"]
description = "Update dependencies while preserving workspace rules"
run = "pnpm run update-deps"

[tasks.health]
description = "Run a lightweight health check"
run = """
pnpm run check:deps
pnpm run build
pnpm run test
"""

[tasks.ci]
description = "Run the main CI workflow locally"
run = """
pnpm run check
pnpm run build
pnpm run test:ci
"""
